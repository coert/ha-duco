###############################################################################
# PACKAGE: Duco API watchdog + HomeWizard smart plug reboot (HTTP+HTTPS)
#
# Watchdog:
# - check elke 60s: GET http://192.168.5.4/info  (HTTP)
# - check elke 60s: GET https://192.168.5.4/info (HTTPS, verify_ssl: false)
# - als HTTPS N min down terwijl HTTP nog OK => eerst integration reload
# - als nog steeds down => power cycle via switch.duco_socket (30s)
# - cooldowns:
#     - minimaal X min tussen integration reloads
#     - minimaal Y min tussen reboots
###############################################################################

homeassistant:
  customize: {}

input_boolean:
  duco_watchdog_enabled:
    name: Duco watchdog enabled
    icon: mdi:shield-check

input_number:
  duco_watchdog_fail_minutes:
    name: Duco watchdog fail minutes
    min: 1
    max: 10
    step: 1
    unit_of_measurement: min
    icon: mdi:timer-alert
    initial: 3

  duco_watchdog_reload_cooldown_minutes:
    name: Duco watchdog reload cooldown minutes
    min: 1
    max: 60
    step: 1
    unit_of_measurement: min
    icon: mdi:timer-refresh
    initial: 5

  duco_watchdog_cooldown_minutes:
    name: Duco watchdog reboot cooldown minutes
    min: 5
    max: 180
    step: 5
    unit_of_measurement: min
    icon: mdi:timer-lock
    initial: 15

counter:
  duco_reboot_count:
    name: Duco reboot count
    icon: mdi:counter

  duco_reload_count:
    name: Duco integration reload count
    icon: mdi:counter

input_datetime:
  duco_last_reboot:
    name: Duco last reboot
    has_date: true
    has_time: true

  duco_last_reload:
    name: Duco last integration reload
    has_date: true
    has_time: true

rest:
  # HTTP heartbeat
  - resource: "http://192.168.5.4/info"
    scan_interval: 60
    timeout: 5
    sensor:
      - name: duco_http_heartbeat
        value_template: >
          {% if value_json is defined and value_json.General is defined %}
            ok
          {% else %}
            error
          {% endif %}

  # HTTPS heartbeat
  - resource: "https://192.168.5.4/info"
    scan_interval: 60
    timeout: 5
    verify_ssl: false
    sensor:
      - name: duco_https_heartbeat
        value_template: >
          {% if value_json is defined and value_json.General is defined %}
            ok
          {% else %}
            error
          {% endif %}

template:
  - binary_sensor:
      - name: duco_http_up
        device_class: connectivity
        state: "{{ is_state('sensor.duco_http_heartbeat','ok') }}"
        availability: "{{ states('sensor.duco_http_heartbeat') not in ['unknown','unavailable','none',''] }}"

      - name: duco_https_up
        device_class: connectivity
        state: "{{ is_state('sensor.duco_https_heartbeat','ok') }}"
        # keep availability permissive so 'unknown/unavailable' still yields OFF state
        availability: "{{ states('sensor.duco_https_heartbeat') not in ['none',''] }}"

      # Overall reachability: either channel up
      - name: duco_api_up
        device_class: connectivity
        state: >
          {{ is_state('binary_sensor.duco_http_up','on') or is_state('binary_sensor.duco_https_up','on') }}

  - sensor:
      - name: duco_watchdog_status
        state: >
          {% if not is_state('input_boolean.duco_watchdog_enabled','on') %}
            disabled
          {% elif is_state('binary_sensor.duco_api_up','on') %}
            up
          {% else %}
            down
          {% endif %}

automation:
  - alias: "Duco watchdog: enable on startup"
    id: duco_watchdog_enable_on_startup
    trigger:
      - platform: homeassistant
        event: start
    action:
      - service: input_boolean.turn_on
        target:
          entity_id: input_boolean.duco_watchdog_enabled

  - alias: "Duco watchdog: reload integration / reboot when HTTPS down (HTTP still OK)"
    id: duco_watchdog_reload_then_reboot_when_https_down
    mode: single

    trigger:
      # Primary: HTTPS considered down
      - platform: state
        entity_id: binary_sensor.duco_https_up
        to: "off"
        for:
          minutes: "{{ states('input_number.duco_watchdog_fail_minutes') | int(3) }}"

      # Fallbacks: raw heartbeat goes unavailable/unknown for long enough
      - platform: state
        entity_id: sensor.duco_https_heartbeat
        to: "unavailable"
        for:
          minutes: "{{ states('input_number.duco_watchdog_fail_minutes') | int(3) }}"

      - platform: state
        entity_id: sensor.duco_https_heartbeat
        to: "unknown"
        for:
          minutes: "{{ states('input_number.duco_watchdog_fail_minutes') | int(3) }}"

    condition:
      - condition: state
        entity_id: input_boolean.duco_watchdog_enabled
        state: "on"

      # Only treat it as SSL-module failure if HTTP is still OK
      - condition: template
        value_template: "{{ is_state('sensor.duco_http_heartbeat','ok') }}"

    action:
      # -----------------------------
      # Step 1: Try integration reload
      # -----------------------------
      - variables:
          fail_minutes: "{{ states('input_number.duco_watchdog_fail_minutes') | int(3) }}"
          reload_cooldown_s: "{{ (states('input_number.duco_watchdog_reload_cooldown_minutes') | int(5)) * 60 }}"
          reboot_cooldown_s: "{{ (states('input_number.duco_watchdog_cooldown_minutes') | int(15)) * 60 }}"
          now_ts: "{{ as_timestamp(now()) }}"
          last_reload: "{{ states('input_datetime.duco_last_reload') }}"
          last_reboot: "{{ states('input_datetime.duco_last_reboot') }}"
          last_reload_ts: >
            {% if last_reload in ['unknown','unavailable','none',''] %}
              0
            {% else %}
              {{ as_timestamp(strptime(last_reload, '%Y-%m-%d %H:%M:%S')) }}
            {% endif %}
          last_reboot_ts: >
            {% if last_reboot in ['unknown','unavailable','none',''] %}
              0
            {% else %}
              {{ as_timestamp(strptime(last_reboot, '%Y-%m-%d %H:%M:%S')) }}
            {% endif %}
          can_reload: "{{ (now_ts - last_reload_ts) > reload_cooldown_s }}"
          can_reboot: "{{ (now_ts - last_reboot_ts) > reboot_cooldown_s }}"

      - choose:
          - conditions:
              - condition: template
                value_template: "{{ can_reload }}"
            sequence:
              - service: input_datetime.set_datetime
                target:
                  entity_id: input_datetime.duco_last_reload
                data:
                  datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"

              - service: counter.increment
                target:
                  entity_id: counter.duco_reload_count

              - service: logbook.log
                data:
                  name: "Duco watchdog"
                  message: "HTTPS down (HTTP OK) → reloading Duco integration config entry."
                  entity_id: sensor.duco_box_ventilation_state

              - service: homeassistant.reload_config_entry
                target:
                  entity_id: sensor.duco_box_ventilation_state

              # Give the integration time to reconnect; REST sensors update every 60s
              - delay: "00:02:00"

      # Re-check after reload attempt (or immediately if reload cooldown blocked it)
      - condition: template
        value_template: >
          {{ is_state('sensor.duco_http_heartbeat','ok') and not is_state('binary_sensor.duco_https_up','on') }}

      # --------------------------------
      # Step 2: If still bad -> powercycle
      # --------------------------------
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ can_reboot }}"
            sequence:
              - service: input_datetime.set_datetime
                target:
                  entity_id: input_datetime.duco_last_reboot
                data:
                  datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"

              - service: counter.increment
                target:
                  entity_id: counter.duco_reboot_count

              - service: logbook.log
                data:
                  name: "Duco watchdog"
                  message: "HTTPS still down after reload (HTTP OK) → power-cycling Duco smart plug (30s)."
                  entity_id: switch.duco_socket

              - service: switch.turn_off
                target:
                  entity_id: switch.duco_socket

              - delay: "00:00:30"

              - service: switch.turn_on
                target:
                  entity_id: switch.duco_socket

          # else: reboot cooldown active -> only log it
        default:
          - service: logbook.log
            data:
              name: "Duco watchdog"
              message: "HTTPS still down but reboot cooldown active → skipping power-cycle."
              entity_id: switch.duco_socket
