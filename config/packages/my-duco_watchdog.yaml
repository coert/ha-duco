###############################################################################
# PACKAGE: Duco API watchdog + HomeWizard smart plug reboot (HTTP+HTTPS)
#
# Watchdog:
# - check elke 60s: GET http://192.168.5.4/info  (HTTP)
# - check elke 60s: GET https://192.168.5.4/info (HTTPS, verify_ssl: false)
# - als HTTPS 3 min down terwijl HTTP nog OK => power cycle via switch.duco_socket (30s)
# - cooldown: minimaal 15 min tussen reboots
###############################################################################

homeassistant:
  customize: {}

input_boolean:
  duco_watchdog_enabled:
    name: Duco watchdog enabled
    icon: mdi:shield-check

input_number:
  duco_watchdog_fail_minutes:
    name: Duco watchdog fail minutes
    min: 1
    max: 10
    step: 1
    unit_of_measurement: min
    icon: mdi:timer-alert
    initial: 3

  duco_watchdog_cooldown_minutes:
    name: Duco watchdog cooldown minutes
    min: 5
    max: 180
    step: 5
    unit_of_measurement: min
    icon: mdi:timer-lock
    initial: 15

counter:
  duco_reboot_count:
    name: Duco reboot count
    icon: mdi:counter

input_datetime:
  duco_last_reboot:
    name: Duco last reboot
    has_date: true
    has_time: true

rest:
  # HTTP heartbeat
  - resource: "http://192.168.5.4/info"
    scan_interval: 60
    timeout: 5
    sensor:
      - name: duco_http_heartbeat
        value_template: >
          {% if value_json is defined and value_json.General is defined %}
            ok
          {% else %}
            error
          {% endif %}

  # HTTPS heartbeat
  - resource: "https://192.168.5.4/info"
    scan_interval: 60
    timeout: 5
    verify_ssl: false
    sensor:
      - name: duco_https_heartbeat
        value_template: >
          {% if value_json is defined and value_json.General is defined %}
            ok
          {% else %}
            error
          {% endif %}

template:
  - binary_sensor:
      - name: duco_http_up
        device_class: connectivity
        state: "{{ is_state('sensor.duco_http_heartbeat','ok') }}"
        availability: "{{ states('sensor.duco_http_heartbeat') not in ['unknown','unavailable','none',''] }}"

      - name: duco_https_up
        device_class: connectivity
        state: "{{ is_state('sensor.duco_https_heartbeat','ok') }}"
        # keep availability permissive so 'unknown/unavailable' still yields OFF state
        availability: "{{ states('sensor.duco_https_heartbeat') not in ['none',''] }}"

      # Overall reachability: either channel up
      - name: duco_api_up
        device_class: connectivity
        state: >
          {{ is_state('binary_sensor.duco_http_up','on') or is_state('binary_sensor.duco_https_up','on') }}

  - sensor:
      - name: duco_watchdog_status
        state: >
          {% if not is_state('input_boolean.duco_watchdog_enabled','on') %}
            disabled
          {% elif is_state('binary_sensor.duco_api_up','on') %}
            up
          {% else %}
            down
          {% endif %}

automation:
  - alias: "Duco watchdog: enable on startup"
    id: duco_watchdog_enable_on_startup
    trigger:
      - platform: homeassistant
        event: start
    action:
      - service: input_boolean.turn_on
        target:
          entity_id: input_boolean.duco_watchdog_enabled

  - alias: "Duco watchdog: reboot when HTTPS down (HTTP still OK)"
    id: duco_watchdog_reboot_when_https_down
    mode: single

    trigger:
      # Primary: HTTPS considered down
      - platform: state
        entity_id: binary_sensor.duco_https_up
        to: "off"
        for:
          minutes: "{{ states('input_number.duco_watchdog_fail_minutes') | int(3) }}"

      # Fallbacks: raw heartbeat goes unavailable/unknown for long enough
      - platform: state
        entity_id: sensor.duco_https_heartbeat
        to: "unavailable"
        for:
          minutes: "{{ states('input_number.duco_watchdog_fail_minutes') | int(3) }}"

      - platform: state
        entity_id: sensor.duco_https_heartbeat
        to: "unknown"
        for:
          minutes: "{{ states('input_number.duco_watchdog_fail_minutes') | int(3) }}"

    condition:
      - condition: state
        entity_id: input_boolean.duco_watchdog_enabled
        state: "on"

      # Only treat it as SSL-module failure if HTTP is still OK
      - condition: template
        value_template: "{{ is_state('sensor.duco_http_heartbeat','ok') }}"

      # Anti-loop: cooldown_minutes between reboots
      - condition: template
        value_template: >
          {% set cooldown = (states('input_number.duco_watchdog_cooldown_minutes') | int(15)) * 60 %}
          {% set last = states('input_datetime.duco_last_reboot') %}
          {% if last in ['unknown','unavailable','none',''] %}
            true
          {% else %}
            {% set last_ts = as_timestamp(strptime(last, '%Y-%m-%d %H:%M:%S')) %}
            {{ (as_timestamp(now()) - last_ts) > cooldown }}
          {% endif %}

    action:
      - service: input_datetime.set_datetime
        target:
          entity_id: input_datetime.duco_last_reboot
        data:
          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"

      - service: counter.increment
        target:
          entity_id: counter.duco_reboot_count

      # Power cycle via smart plug
      - service: switch.turn_off
        target:
          entity_id: switch.duco_socket

      - delay: "00:00:30"

      - service: switch.turn_on
        target:
          entity_id: switch.duco_socket